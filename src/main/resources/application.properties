spring.application.name=store
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:store;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
server.port=${PORT:8080}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
app.jwt.secret=${JWT_SECRET:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
